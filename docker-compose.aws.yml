services:
  api:
    build: ./api
    container_name: sports_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: America/Los_Angeles
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
    volumes:
      - ./api:/app
      - ./pipeline:/pipeline
      - ./frontend:/frontend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  scheduler:
    build: ./api
    container_name: sports_scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: America/Los_Angeles
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
    volumes:
      - ./api:/app
      - ./pipeline:/pipeline
    command: python3 /pipeline/daily_pipeline.py

  live_poller:
    build: ./api
    container_name: sports_live_poller
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: America/Los_Angeles
      API_BASE_URL: http://api:8000
      PYTHONPATH: /app:/pipeline
    volumes:
      - ./api:/app
      - ./pipeline:/pipeline
    command: python3 /pipeline/mlb/live_poller.py
