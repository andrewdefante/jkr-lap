<!DOCTYPE html>
<html>
<head>
  <title>NFL Matchups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif;
           background: #f5f5f3; color: #1a1a1a; padding: 1rem; }

    .header { display: flex; align-items: center; gap: 12px;
              margin-bottom: 1.5rem; flex-wrap: wrap; }
    .header h1 { font-size: 16px; font-weight: 500; }
    .header a { font-size: 13px; color: #555; text-decoration: none; }
    .header a:hover { color: #1a1a1a; }
    select { font-size: 13px; border: 1px solid #ddd;
             padding: 4px 8px; border-radius: 4px; background: white; }
    button { font-size: 13px; padding: 4px 12px; border: 1px solid #ddd;
             border-radius: 4px; background: white; cursor: pointer; }
    button:hover { background: #f0f0f0; }
    #status { font-size: 12px; color: #888; }

    .games-grid { display: flex; flex-direction: column; gap: 12px; }

    .game-card { background: white; border-radius: 8px;
                 border: 1px solid #e8e8e6; overflow: hidden; }

    .game-header { display: flex; align-items: center; justify-content: space-between;
                   padding: 10px 16px; border-bottom: 1px solid #f0f0ee;
                   background: #fafaf8; flex-wrap: wrap; gap: 8px; }
    .matchup { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
    .matchup .at { color: #888; font-weight: 400; margin: 0 6px; }
    .game-meta { font-size: 12px; color: #666; display: flex; gap: 12px;
                 align-items: center; flex-wrap: wrap; }
    .score { font-size: 13px; font-weight: 500; color: #1a1a1a; }
    .spread { font-size: 12px; color: #888; }

    .weather-toggle { font-size: 11px; color: #185FA5; cursor: pointer;
                      text-decoration: underline; white-space: nowrap; }
    .weather-panel { display: none; padding: 8px 16px; background: #f0f4fa;
                     border-bottom: 1px solid #e0e8f4; font-size: 12px;
                     color: #333; gap: 16px; flex-wrap: wrap; }
    .weather-panel.open { display: flex; }
    .weather-item { display: flex; gap: 4px; }
    .weather-label { color: #888; }

    .stats-grid { display: grid; grid-template-columns: 1fr auto 1fr;
                  gap: 0; padding: 0; }
    .team-col { padding: 12px 16px; }
    .team-col.away { text-align: right; }
    .team-col.home { text-align: left; }
    .divider-col { display: flex; flex-direction: column;
                   align-items: center; padding: 12px 4px;
                   border-left: 1px solid #f0f0ee;
                   border-right: 1px solid #f0f0ee; }

    .team-name { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .team-name.home { color: #1a1a1a; }
    .team-name.away { color: #1a1a1a; }

    .stat-row { display: contents; }
    .stat-val { font-size: 13px; font-weight: 500; padding: 3px 0; }
    .stat-val.good { color: #2d7a2d; }
    .stat-val.bad { color: #cc2200; }
    .stat-label { font-size: 10px; color: #888; text-transform: uppercase;
                  letter-spacing: .04em; padding: 3px 0; white-space: nowrap; }

    .section-header { font-size: 10px; font-weight: 600; color: #888;
                      text-transform: uppercase; letter-spacing: .05em;
                      padding: 8px 0 4px 0; border-top: 1px solid #f0f0ee;
                      margin-top: 6px; }
    .section-header-center { text-align: center; }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr auto 1fr; }
      .stat-val { font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="header">
  <a href="/mlb-dashboard">← Dashboard</a>
  <h1>NFL Matchups</h1>
  <select id="season-picker" onchange="loadWeeks()">
    <option value="2026">2026</option>
    <option value="2025">2025</option>
  </select>
  <select id="week-picker" onchange="loadData()"></select>
  <span id="status"></span>
</div>

<div id="games" class="games-grid"></div>

<script>
const API = '';

function fmt(v, decimals=1) {
  if (v == null) return '—';
  return Number(v).toFixed(decimals);
}

function colorEPA(v, invert=false) {
  if (v == null) return '';
  const good = invert ? v < 0 : v > 0;
  return good ? 'good' : 'bad';
}

function colorYds(v, allowed=false) {
  if (v == null) return '';
  if (allowed) return v > 5 ? 'bad' : v < 3.5 ? 'good' : '';
  return v > 5 ? 'good' : v < 3.5 ? 'bad' : '';
}

function roofIcon(roof) {
  if (!roof) return '';
  if (roof.includes('dome')) return '🏟️ Dome';
  if (roof.includes('retract')) return '🏟️ Retractable';
  return '🌤️ Outdoors';
}

function buildWeatherPanel(g) {
  const items = [];
  if (g.temp != null) items.push(`<span class="weather-item"><span class="weather-label">Temp:</span> ${g.temp}°F</span>`);
  if (g.wind != null) items.push(`<span class="weather-item"><span class="weather-label">Wind:</span> ${g.wind} mph</span>`);
  if (g.roof) items.push(`<span class="weather-item"><span class="weather-label">Roof:</span> ${roofIcon(g.roof)}</span>`);
  if (g.surface) items.push(`<span class="weather-item"><span class="weather-label">Surface:</span> ${g.surface}</span>`);
  if (g.stadium) items.push(`<span class="weather-item"><span class="weather-label">Stadium:</span> ${g.stadium}</span>`);
  return items.join('');
}

function buildStatRows(home, away) {
  const rows = [
    // Offense
    { label: 'OFFENSE', header: true },
    { label: 'EPA/Play', hVal: fmt(home.off_epa, 3), aVal: fmt(away.off_epa, 3),
      hClass: colorEPA(home.off_epa), aClass: colorEPA(away.off_epa) },
    { label: 'Avg Rush Yds', hVal: fmt(home.avg_rush_yds), aVal: fmt(away.avg_rush_yds),
      hClass: colorYds(home.avg_rush_yds), aClass: colorYds(away.avg_rush_yds) },
    { label: 'Avg Pass Yds', hVal: fmt(home.avg_pass_yds), aVal: fmt(away.avg_pass_yds),
      hClass: colorYds(home.avg_pass_yds), aClass: colorYds(away.avg_pass_yds) },
    { label: 'Run %', hVal: home.run_pct != null ? home.run_pct + '%' : '—',
                      aVal: away.run_pct != null ? away.run_pct + '%' : '—' },
    { label: 'Pass %', hVal: home.pass_pct != null ? home.pass_pct + '%' : '—',
                       aVal: away.pass_pct != null ? away.pass_pct + '%' : '—' },
    { label: 'Avg Pts', hVal: fmt(home.avg_pts_scored), aVal: fmt(away.avg_pts_scored),
      hClass: colorEPA(home.avg_pts_scored), aClass: colorEPA(away.avg_pts_scored) },
    // Defense
    { label: 'DEFENSE', header: true },
    { label: 'EPA/Play Allowed', hVal: fmt(home.def_epa, 3), aVal: fmt(away.def_epa, 3),
      hClass: colorEPA(home.def_epa, true), aClass: colorEPA(away.def_epa, true) },
    { label: 'Rush Yds Allowed', hVal: fmt(home.avg_rush_yds_allowed), aVal: fmt(away.avg_rush_yds_allowed),
      hClass: colorYds(home.avg_rush_yds_allowed, true), aClass: colorYds(away.avg_rush_yds_allowed, true) },
    { label: 'Pass Yds Allowed', hVal: fmt(home.avg_pass_yds_allowed), aVal: fmt(away.avg_pass_yds_allowed),
      hClass: colorYds(home.avg_pass_yds_allowed, true), aClass: colorYds(away.avg_pass_yds_allowed, true) },
    { label: 'Avg Pts Allowed', hVal: fmt(home.avg_pts_allowed), aVal: fmt(away.avg_pts_allowed),
      hClass: colorYds(home.avg_pts_allowed, true), aClass: colorYds(away.avg_pts_allowed, true) },
    { label: 'Blitz Proxy %', hVal: home.blitz_proxy_pct != null ? home.blitz_proxy_pct + '%' : '—',
                               aVal: away.blitz_proxy_pct != null ? away.blitz_proxy_pct + '%' : '—' },
  ];

  let homeHTML = '';
  let centerHTML = '';
  let awayHTML = '';

  for (const row of rows) {
    if (row.header) {
      homeHTML += `<div class="section-header">${row.label}</div>`;
      centerHTML += `<div class="section-header section-header-center">&nbsp;</div>`;
      awayHTML += `<div class="section-header" style="text-align:right">${row.label}</div>`;
    } else {
      homeHTML += `<div class="stat-val ${row.hClass||''}">${row.hVal}</div>`;
      centerHTML += `<div class="stat-label">${row.label}</div>`;
      awayHTML += `<div class="stat-val ${row.aClass||''}">${row.aVal}</div>`;
    }
  }

  return { homeHTML, centerHTML, awayHTML };
}

function buildGameCard(g, idx) {
  const home = g.home_stats || {};
  const away = g.away_stats || {};
  const { homeHTML, centerHTML, awayHTML } = buildStatRows(home, away);

  // spread_line is from the home team's perspective — negative means home is favored
  const spreadStr = g.spread_line != null ? (() => {
    const favored = g.spread_line < 0 ? g.home_team : g.away_team;
    const line = Math.abs(g.spread_line).toFixed(1);
    return `${favored} -${line} · O/U ${g.total_line ?? '—'}`;
  })() : '';

  const scoreStr = g.home_score != null
    ? `${g.away_team} ${g.away_score} @ ${g.home_team} ${g.home_score} · Final`
    : '';

  const weatherHTML = buildWeatherPanel(g);

  return `
    <div class="game-card">
      <div class="game-header">
        <div>
          <div class="matchup">
            ${g.away_team} <span class="at">@</span> ${g.home_team}
          </div>
          ${scoreStr ? `<div class="score" style="margin-top:2px">${scoreStr}</div>` : ''}
        </div>
        <div class="game-meta">
          ${g.game_time_pt ? `<span>⏰ ${g.game_time_pt}</span>` : ''}
          ${g.location ? `<span>📍 ${g.location}</span>` : ''}
          ${spreadStr ? `<span class="spread">${spreadStr}</span>` : ''}
          ${weatherHTML ? `<span class="weather-toggle" onclick="toggleWeather(${idx})">🌤 Weather</span>` : ''}
        </div>
      </div>

      <div class="weather-panel" id="weather-${idx}">
        ${weatherHTML}
      </div>

      <div class="stats-grid">
        <div class="team-col away">
          <div class="team-name away">${g.away_team}</div>
          ${awayHTML}
        </div>
        <div class="divider-col">
          <div style="font-size:10px;color:#ccc;margin-top:22px">vs</div>
          ${centerHTML}
        </div>
        <div class="team-col home">
          <div class="team-name home">${g.home_team}</div>
          ${homeHTML}
        </div>
      </div>

      <div style="padding:6px 16px 8px;font-size:10px;color:#aaa;">
        Spread = Vegas point spread (team listed is favored by that many points) ·
        O/U = total points over/under · Stats = last 3 weeks same season ·
        EPA = expected points added per play · Blitz % = proxy (high-pressure pass plays)
      </div>
    </div>
  `;
}

function toggleWeather(idx) {
  const panel = document.getElementById(`weather-${idx}`);
  panel.classList.toggle('open');
}

async function loadWeeks() {
  const season = document.getElementById('season-picker').value;
  const status = document.getElementById('status');
  status.textContent = 'Loading...';

  try {
    const res = await fetch(`${API}/nfl/weeks?season=${season}`);
    const weeks = await res.json();

    const picker = document.getElementById('week-picker');
    picker.innerHTML = weeks.map(w =>
      `<option value="${w.week}">Week ${w.week} (${w.game_count} games)</option>`
    ).join('');

    // Default to the most recent week with games on/before today, else the last week listed
    const todayStr = new Date().toISOString().slice(0, 10);
    const current = [...weeks].reverse().find(w => w.week_start <= todayStr);
    picker.value = (current || weeks[weeks.length - 1])?.week || 1;

    loadData();
  } catch (e) {
    status.textContent = 'Error loading weeks';
    console.error(e);
  }
}

async function loadData() {
  const season = document.getElementById('season-picker').value;
  const week = document.getElementById('week-picker').value;
  const status = document.getElementById('status');
  const container = document.getElementById('games');
  status.textContent = 'Loading...';
  container.innerHTML = '';

  try {
    const res = await fetch(`${API}/nfl/matchups?season=${season}&week=${week}`);
    const data = await res.json();

    if (!data.length) {
      container.innerHTML = '<p style="color:#888;font-size:13px;padding:1rem 0;">No NFL games found for this week.</p>';
      status.textContent = '';
      return;
    }

    container.innerHTML = data.map((g, i) => buildGameCard(g, i)).join('');
    status.textContent = `${data.length} game${data.length !== 1 ? 's' : ''} · ${season} Week ${week}`;
  } catch(e) {
    status.textContent = 'Error loading data';
    console.error(e);
  }
}

loadWeeks();
</script>
</body>
</html>
